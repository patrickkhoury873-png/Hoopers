<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hoopers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--ink:#0e1624;--maple:#d9a066;--a:#19b5a5;--b:#f0553a;--fg:#f4efe6;color-scheme:dark}

button:hover,button:focus-visible{background:var(--fg);outline:2px solid var(--a)}

#login{inset:0;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#login h1{font-size:110px;line-height:.9;color:var(--maple);letter-spacing:2px}
#top{top:10px;right:10px;display:none;gap:8px;padding:8px;border:0;background:none}
#prof{top:10px;left:10px;display:none;line-height:1.5}
#sb{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:none;gap:2px;font:700 34px Teko,Impact,sans-serif;pointer-events:none}
#sb span{padding:0 18px;background:rgba(14,22,36,.85)}#sb .a{border-bottom:4px solid var(--a)}#sb .b{border-bottom:4px solid var(--b)}
#msg{position:fixed;top:25%;width:100%;text-align:center;font:700 64px Teko,Impact,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 3px 12px #000}
#meter{position:fixed;bottom:70px;left:50%;margin-left:-150px;width:300px;height:22px;border:2px solid #fff;display:none}
#cur{position:absolute;top:-6px;bottom:-6px;width:4px;background:#fff;box-shadow:0 0 6px #000}
#stam{position:fixed;bottom:40px;left:50%;margin-left:-100px;width:200px;height:8px;background:#222;display:none}#stf{height:100%;background:var(--a)}
#chat{position:fixed;left:10px;bottom:10px;width:340px;display:none}
#log{max-height:150px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:14px;text-shadow:0 1px 3px #000}
#ci{display:none;width:100%;box-sizing:border-box}
#play,#set,#sub,#res{display:none;top:50%;left:50%;transform:translate(-50%,-50%);max-width:520px;max-height:80vh;overflow:auto}
#sub{z-index:5;border-color:var(--a)}#res{text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0}
</style></head><body>
<div id="login" class="pn"><h1>HOOPERS</h1><p id="lm" style="margin:0">Log in or create an account to play and save your progress.</p>
<input id="lu" placeholder="Username" maxlength="16" autocomplete="username"><input id="lp" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<div style="display:flex;gap:8px"><button id="bl">Log in</button><button id="br">Sign up</button></div><p id="le" style="color:var(--b);margin:0"></p></div>
<div id="prof" class="pn"></div>
<div id="top" class="pn"><button id="bp">Play</button><button id="bs">Settings</button></div>
<div id="play" class="pn"><h2>Play</h2><p style="margin:2px 0 8px">Pick a game mode.</p><div id="modes" style="display:grid;gap:6px"></div><p style="margin:8px 0 0"><button id="pc">Close</button></p></div>
<div id="sub" class="pn"><h2 id="st"></h2><div style="display:flex;gap:8px;margin-top:8px"><button id="sbot">Bot</button><button disabled title="Public matches are not built yet">Public</button><button id="sc">Back</button></div></div>
<div id="set" class="pn"><h2>Settings</h2><div id="sbody"></div><p style="margin:10px 0 0"><button id="sx">Close</button> <button id="lo">Log out</button></p></div>
<div id="res" class="pn"></div>
<div id="sb"><span class="a">YOU 0</span><span class="b">CPU 0</span></div><div id="msg"></div>
<div id="meter"><div id="cur"></div></div><div id="stam"><div id="stf"></div></div>
<div id="chat"><div id="log"></div><input id="ci" maxlength="200" placeholder="Press Enter to send, Esc to close"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,G=18,sgn=Math.sign,$=id=>document.getElementById(id);
// ---------- state ----------
let tok=localStorage.hk_tok||'',me=null,ws=null,scene='lobby',running=false,pause=0,clock=0,lastScorer=0,nT=1,lastSend=0;
const DB={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',jump:'Space',dribble:'KeyE',pivot:'KeyQ',direct:'KeyF',bounce:'KeyC',lob:'KeyR',block:'ShiftLeft'};
const LBL={up:'Move forward',down:'Move back',left:'Move left',right:'Move right',jump:'Jump',dribble:'Start/stop dribble',pivot:'Pivot',direct:'Direct pass',bounce:'Bounce pass',lob:'Lob pass',block:'Block (Shift)'};

// ---------- three setup ----------
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);

addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});
const out=new T.Mesh(new T.PlaneGeometry(120,80),new T.MeshLambertMaterial({color:0x1b2a40}));out.rotation.x=-Math.PI/2;out.position.y=-.02;S.add(out);
const mat=c=>new T.MeshLambertMaterial({color:c});
// ---------- characters ----------
const skins=[0xf2c9a0,0xc68642,0x8d5524,0xe0ac69,0x6b4226];
function mk(col,skin){const gr=new T.Group(),part=(w,h,d,c,x,y,z)=>{const p=new T.Group(),b=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));b.position.y=-h/2;b.castShadow=true;p.add(b);p.position.set(x,y,z);gr.add(p);return p};
const lL=part(.28,.85,.3,skin,-.17,.85,0),lR=part(.28,.85,.3,skin,.17,.85,0),aL=part(.22,.8,.24,skin,-.47,1.6,0),aR=part(.22,.8,.24,skin,.47,1.6,0);
const add=(w,h,d,c,y)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(0,y,0);m.castShadow=true;gr.add(m)};
add(.64,.34,.4,0x161c28,.92);add(.72,.8,.38,col,1.25);add(.42,.42,.42,skin,1.88);
for(const x of[-.1,.1]){const e=new T.Mesh(new T.BoxGeometry(.06,.06,.02),new T.MeshBasicMaterial({color:0x111111}));e.position.set(x,1.9,.22);gr.add(e)}
S.add(gr);return{g:gr,lL,lR,aL,aR,x:0,z:0,y:0,vy:0,vx:0,vz:0,mx:0,mz:0,f:0,ph:0,dr:false,air:false,shoot:null,pr:0,blk:0,bt:0,bcd:0,pass:0,ait:1,m:null}}
function label(t){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='700 40px Teko,Impact,sans-serif';g.textAlign='center';g.fillStyle='rgba(14,22,36,.8)';g.fillRect(0,8,256,48);g.fillStyle='#f4efe6';g.fillText(t,128,46);
const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false}));s.scale.set(2,.5,1);s.position.y=2.6;return s}
const ball={x:0,y:1,z:0,vx:0,vy:0,vz:0,st:'dead',h:null,age:0,passTo:null,shot:null,last:null,cool:0,bn:0,d:0,rb:0};
const bm=new T.Mesh(new T.SphereGeometry(.24,16,12),new T.MeshLambertMaterial({color:0xe8702a}));bm.castShadow=true;
for(const r of[0,1]){const t=new T.Mesh(new T.TorusGeometry(.24,.012,6,24),new T.MeshBasicMaterial({color:0x111111}));t.rotation.y=r*Math.PI/2;bm.add(t)}S.add(bm);
function anim(p,dt){const sp=Math.hypot(p.mx,p.mz),a=Math.sin(p.ph)*.9*Math.min(1,sp/4);
p.g.position.set(p.x,p.y+(p.air?0:Math.abs(Math.sin(p.ph*2))*.04*Math.min(1,sp)),p.z);p.g.rotation.y=p.f;
p.lL.rotation.x=p.air?.4:a;p.lR.rotation.x=p.air?-.3:-a;let ax=-a*.8,bx=a*.8,az=0;
if(p.shoot||p.m){ax=bx=-2.6}else if(p.blk>0){ax=bx=-2.8;az=.9}else if(p.pass>0)ax=bx=-1.4;else if(ball.h===p&&ball.st=='held'){if(p.dr){ax=-.3;bx=-.8-.4*Math.abs(Math.sin(clock*7))}else ax=bx=-.9}
p.aL.rotation.x=ax;p.aR.rotation.x=bx;p.aL.rotation.z=-az;p.aR.rotation.z=az}
// ---------- lobby ----------
const lobby=new T.Group();S.add(lobby);
{const c=document.createElement('canvas');c.width=1440;c.height=960;const g=c.getContext('2d');
const gr=g.createLinearGradient(0,0,1440,960);gr.addColorStop(0,'#e0aa6c');gr.addColorStop(.5,'#c98f4f');gr.addColorStop(1,'#dca468');g.fillStyle=gr;g.fillRect(0,0,1440,960);
for(let i=0;i<24;i++){g.fillStyle=i%2?'rgba(0,0,0,.06)':'rgba(255,255,255,.05)';g.fillRect(i*60,0,60,960);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(i*60,0,2,960)}
g.strokeStyle='#fff';g.lineWidth=8;g.strokeRect(20,20,1400,920);
g.fillStyle='#0e1624';g.beginPath();g.arc(720,560,230,0,7);g.fill();g.strokeStyle='#e8702a';g.lineWidth=10;g.beginPath();g.arc(720,560,230,0,7);g.stroke();
g.strokeStyle='#e8702a';g.lineWidth=12;g.beginPath();g.moveTo(490,560);g.lineTo(950,560);g.moveTo(720,330);g.lineTo(720,790);g.stroke();
g.beginPath();g.arc(430,560,170,-.9,.9);g.stroke();g.beginPath();g.arc(1010,560,170,Math.PI-.9,Math.PI+.9);g.stroke();
g.fillStyle='#0e1624';g.font='700 190px Teko,Impact,sans-serif';g.textAlign='center';g.fillText('HOOPERS',720,220);
const fl=new T.Mesh(new T.PlaneGeometry(18,12),new T.MeshStandardMaterial({map:new T.CanvasTexture(c),roughness:.22,metalness:.15}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;lobby.add(fl)}
const LP=mk(0x19b5a5,skins[0]);lobby.add(LP.g);const remotes={};
function rem(n,d){let r=remotes[n];if(!r){r=mk(0xe8702a,skins[n.length%5]);lobby.add(r.g);const l=label(n);r.g.add(l);r.tx=d[0];r.tz=d[1];r.x=d[0];r.z=d[1];remotes[n]=r}r.tx=d[0];r.tz=d[1];r.tf=d[2]}
function lobbyFrame(dt){let dx=(K(B.right)?1:0)-(K(B.left)?1:0),dz=(K(B.down)?1:0)-(K(B.up)?1:0);
if(!typing()&&(dx||dz)){const l=Math.hypot(dx,dz);dx/=l;dz/=l;LP.mx=dx*5;LP.mz=dz*5;LP.x=Math.max(-8,Math.min(8,LP.x+dx*5*dt));LP.z=Math.max(-5,Math.min(5,LP.z+dz*5*dt));LP.ph+=dt*11;turn(LP,Math.atan2(dx,dz),10*dt)}else{LP.mx=LP.mz=0}
anim(LP,dt);for(const n in remotes){const r=remotes[n];r.x+=(r.tx-r.x)*Math.min(1,10*dt);r.z+=(r.tz-r.z)*Math.min(1,10*dt);const m=Math.hypot(r.tx-r.x,r.tz-r.z);r.mx=m>.05?4:0;r.ph+=dt*(m>.05?11:0);if(r.tf!==undefined)r.f=r.tf;anim(r,dt)}
if(ws&&ws.readyState==1&&clock-lastSend>.1){lastSend=clock;ws.send(JSON.stringify({t:'pos',x:LP.x,z:LP.z,f:LP.f}))}
C.position.set(0,8.5,10.5);C.lookAt(0,0,.5);bm.visible=false;R.render(S,C)}
const turn=(p,a,r)=>{let d=Math.atan2(Math.sin(a-p.f),Math.cos(a-p.f));p.f+=d*Math.min(1,r)};
// ---------- input ----------
const keys={},press={};let mouse={l:0,r:0};
const typing=()=>document.activeElement&&document.activeElement.tagName=='INPUT';
const K=c=>keys[c]||(c=='KeyW'&&keys.ArrowUp)||(c=='KeyS'&&keys.ArrowDown)||(c=='KeyA'&&keys.ArrowLeft)||(c=='KeyD'&&keys.ArrowRight);
let rebind=null;
addEventListener('keydown',e=>{if(rebind){e.preventDefault();B[rebind]=e.code;localStorage.hk_binds=JSON.stringify(B);rebind=null;setUI();return}
if(e.code=='Enter'&&me){const ci=$('ci');if(typing()&&document.activeElement===ci){const v=ci.value.trim();if(v&&ws)ws.send(JSON.stringify({t:'chat',m:v}));ci.value='';ci.blur();ci.style.display='none'}else if(!typing()){ci.style.display='block';ci.focus();Object.keys(keys).forEach(k=>keys[k]=0)}return}
if(e.code=='Escape'&&document.activeElement===$('ci')){$('ci').value='';$('ci').blur();$('ci').style.display='none';return}
if(typing())return;if(e.code=='Space'||e.code.startsWith('Arrow')||e.code.startsWith('Shift'))e.preventDefault();if(!e.repeat)press[e.code]=1;keys[e.code]=1});
addEventListener('keyup',e=>{keys[e.code]=0});
const clearInput=()=>{Object.keys(keys).forEach(k=>keys[k]=0);mouse.l=mouse.r=0;const cp=ctl();if(cp&&cp.m)cancelShot(cp)};
addEventListener('blur',clearInput);document.addEventListener('visibilitychange',clearInput);addEventListener('contextmenu',e=>e.preventDefault());
R.domElement.addEventListener('mousedown',e=>{if(scene!='game'||!running)return;if(e.button==0){mouse.l=1;startShot()}if(e.button==2)mouse.r=1});
addEventListener('mouseup',e=>{if(e.button==0){mouse.l=0;finishShot()}if(e.button==2)mouse.r=0});
// ---------- court ----------
let courtG=null,LX=16,WZ=8.5,HX=14.95,TPR=6.75,boards={};
function buildCourt(n){if(courtG)S.remove(courtG);courtG=new T.Group();S.add(courtG);LX=n==1?10:16;WZ=n==1?5.5:8.5;HX=LX-1.05;TPR=n==1?5:6.75;
const K2=40,c=document.createElement('canvas');c.width=LX*2*K2;c.height=WZ*2*K2;const g=c.getContext('2d'),X=x=>(x+LX)*K2,Y=z=>(z+WZ)*K2;
g.fillStyle='#d9a066';g.fillRect(0,0,c.width,c.height);for(let i=0;i<LX*2;i++){g.fillStyle=i%2?'rgba(0,0,0,.05)':'rgba(255,255,255,.04)';g.fillRect(i*K2,0,K2,c.height)}
g.fillStyle='rgba(14,22,36,.38)';g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(2,2,c.width-4,c.height-4);g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),c.height);g.stroke();g.beginPath();g.arc(X(0),Y(0),1.8*K2,0,7);g.stroke();
const ang=Math.asin(Math.min(1,(WZ-.5)/TPR));
for(const s of[-1,1]){const bx=s*LX,fx=s*(LX-5.8);g.fillRect(Math.min(X(bx),X(fx)),Y(-2.45),5.8*K2,4.9*K2);g.strokeRect(Math.min(X(bx),X(fx)),Y(-2.45),5.8*K2,4.9*K2);g.beginPath();g.arc(X(fx),Y(0),1.8*K2,0,7);g.stroke();
g.beginPath();g.arc(X(s*HX),Y(0),TPR*K2,s>0?Math.PI-ang:-ang,s>0?Math.PI+ang:ang);g.stroke();
for(const z of[-1,1]){g.beginPath();g.moveTo(X(s*(HX-TPR*Math.cos(ang))),Y(z*(WZ-.5)));g.lineTo(X(bx),Y(z*(WZ-.5)));g.stroke()}}
const ct=new T.Mesh(new T.PlaneGeometry(LX*2,WZ*2),new T.MeshLambertMaterial({map:new T.CanvasTexture(c)}));ct.rotation.x=-Math.PI/2;ct.receiveShadow=true;courtG.add(ct);
Object.assign(sun.shadow.camera,{left:-LX-6,right:LX+6,top:WZ+8,bottom:-WZ-8,near:1,far:50});sun.shadow.camera.updateProjectionMatrix();
const bx=(w,h,d,col,x,y,z,o,p)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:col,transparent:!!o,opacity:o||1}));m.position.set(x,y,z);m.castShadow=true;(p||courtG).add(m);return m};
for(const s of[-1,1]){const gp=new T.Group();courtG.add(gp);boards[s]=gp;bx(.2,3.6,.2,0x333b4a,s*(HX+1.0),1.8,0,0,gp);bx(.6,.14,.14,0x333b4a,s*(HX+.75),3.4,0,0,gp);bx(.1,1.4,2.3,0xffffff,s*(HX+.5),3.5,0,.7,gp);
const r=new T.Mesh(new T.TorusGeometry(.32,.03,8,20),mat(0xf0553a));r.rotation.x=Math.PI/2;r.position.set(s*HX,3.05,0);courtG.add(r);
const nt=new T.Mesh(new T.CylinderGeometry(.32,.18,.5,10,1,true),new T.MeshBasicMaterial({color:0xffffff,wireframe:true}));nt.position.set(s*HX,2.78,0);courtG.add(nt)}
// grandstands + crowd
const fans=new T.InstancedMesh(new T.BoxGeometry(.5,.9,.4),new T.MeshLambertMaterial(),400);let fi=0;const cl=new T.Color(),m4=new T.Matrix4(),pal=[0xf0553a,0x19b5a5,0xf4efe6,0xd9a066,0x8d5524,0xffd23f];
for(const s of[-1,1])for(let r=0;r<4;r++){const z=s*(WZ+2+r*1.3),y=.4+r*.8;bx(LX*2-2,.8+r*.8,1.3,0x2a3a55,0,(.8+r*.8)/2-.0,z);for(let x=-LX+2;x<LX-1&&fi<400;x+=1.3){m4.setPosition(x,1.25+r*.8,z);fans.setMatrixAt(fi,m4);cl.setHex(pal[(Math.random()*pal.length)|0]);fans.setColorAt(fi++,cl)}}
fans.count=fi;fans.instanceColor.needsUpdate=true;courtG.add(fans)}
// ---------- game logic ----------
let P=[],score=[0,0],mode=1,cd=1,camAng=0,cx=0,stam=100;
const hoopOf=t=>[t?-HX:HX,0],dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const maxSt=()=>100+15*(lvl('stamina')-1);
function hud(){const s=$('sb').children;s[0].textContent='YOU '+score[0];s[1].textContent='CPU '+score[1]}
let mt;function flash(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(mt);mt=setTimeout(()=>m.style.opacity=0,900)}
function setHolder(p){ball.st='held';ball.h=p;ball.passTo=null;ball.shot=null;P.forEach(q=>q.dr=false);p.dr=true;p.shoot=null}
function place(tb){const b=[[0,0],[2,-4],[2,4],[5,-2],[5,3]];P.forEach(p=>{const q=b[p.i];p.x=p.t?1.5+q[0]:-1.5-q[0];p.z=q[1]*(mode==1?.5:1);p.y=0;p.vy=0;p.air=false;p.shoot=null;p.m=null;p.f=p.t?-Math.PI/2:Math.PI/2;p.mx=p.mz=0;p.dr=false;p.blk=0});setHolder(P.find(p=>p.t==tb&&p.i==0));ball.last=null;cx=P.find(p=>p.t==tb&&p.i==0).x;cd=tb?-1:1;camAng=tb?Math.PI:0}
function startGame(n){P.forEach(p=>S.remove(p.g));P=[];mode=n;score=[0,0];buildCourt(n);
for(let t=0;t<2;t++)for(let i=0;i<n;i++){const p=mk(t?0xf0553a:0x19b5a5,skins[(i+t*2)%5]);p.t=t;p.i=i;P.push(p)}
lobby.visible=false;courtG.visible=true;scene='game';running=true;pause=0;stam=maxSt();bm.visible=true;place(0);hud();
['top','prof'].forEach(i=>$(i).style.display='none');$('sb').style.display='flex';$('stam').style.display='block';$('chat').style.display='block';closePanels()}
function endGame(){running=false;const win=score[0]>score[1];if(ws&&ws.readyState==1)ws.send(JSON.stringify({t:'result',win}));
$('res').innerHTML='<h2>'+(win?'You win ':'You lose ')+score[0]+'–'+score[1]+'</h2><p>+'+(win?80:30)+' coins, +'+(win?260:100)+' XP</p><button id="rb">Back to lobby</button>';$('res').style.display='block';$('rb').onclick=toLobby}
function toLobby(){P.forEach(p=>S.remove(p.g));P=[];running=false;scene='lobby';courtG.visible=false;lobby.visible=true;$('res').style.display='none';

function ctl(){if(!P.length)return null;if(ball.st=='held'&&ball.h.t==0)return ball.h;if(ball.st=='flight'&&ball.passTo&&ball.passTo.t==0)return ball.passTo;const r=ball.st=='held'?ball.h:ball;let b=null,d=1e9;for(const p of P)if(p.t==0){const k=Math.hypot(p.x-r.x,p.z-r.z);if(k<d){d=k;b=p}}return b}

let b=null,bs=-9;for(const q of m){const dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz)||1,s=(dx*Math.sin(p.f)+dz*Math.cos(p.f))/d-d*.01;if(s>bs){bs=s;b=q}}

function block(p){if(p.bcd>0||p.air||ball.h===p)return;p.blk=.6;p.bcd=1.2;p.air=true;p.vy=6.2;p.vx=p.mx*.5;p.vz=p.mz*.5}

function scoreIt(t){const pts=ball.d>TPR?3:2;score[t]+=pts;hud();flash((t?'CPU ':'YOU ')+'SCORE +'+pts);ball.st='dead';ball.vx=ball.vz=0;lastScorer=t;pause=1.6;if(score[t]>=21){running=false;setTimeout(endGame,1200)}}

if(pause>0){pause-=dt;if(pause<=0&&running)place(lastScorer?0:1)}
else{const cp=ctl(),mx=maxSt();
if(cp){cp.hum=true;const holder=ball.h===cp&&ball.st=='held';let vf=(K(B.up)?1:0)-(K(B.down)?1:0),vr=(K(B.right)?1:0)-(K(B.left)?1:0);

for(const p of P){if(p.shoot&&ball.h===p&&p.vy<=.8)release(p);
if(p.air){p.vy-=20*dt;p.y+=p.vy*dt;p.x+=p.vx*dt;p.z+=p.vz*dt;if(p.y<=0){p.y=0;p.vy=0;p.air=false;p.shoot=null;p.vx=p.vz=0}}

// ---------- UI / accounts ----------
